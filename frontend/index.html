    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FINAP - Tech & Fun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              finap: {
                bg: '#F8FAFC', // Slate 50 - Professional Light Gray
                primary: '#14B8A6', // Teal 500 - Professional Turquoise
                secondary: '#99F6E4', // Teal 200 - Pastel Turquoise
                alert: '#F97316', // Orange
                success: '#10B981', // Emerald
                gold: '#FBBF24', // Amber Gold
                dark: '#0F172A', // Slate 900 - High contrast text
                light: '#FFFFFF', // White
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        background-color: #F8FAFC;
        font-family: 'Inter', sans-serif;
      }
      /* Hide scrollbar for cleaner mobile look */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
